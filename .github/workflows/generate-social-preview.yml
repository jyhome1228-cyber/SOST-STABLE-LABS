name: Generate social preview

on:
  push:
    paths:
      - '.github/workflows/generate-social-preview.yml'
      - 'assets/og-sost.png'
      - 'assets/sost-symbol.svg'
      - 'css/global-cta.css'
      - 'js/home-cta-enhance.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply favicon, Open Graph and home CTA assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          favicon = './assets/sost-symbol.svg?v=20260818-1'
          preview = 'https://sostlabs.com/assets/og-sost.png?v=20260818-1'

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'<link\s+rel="icon"\s+href="[^"]+"\s+type="image/svg\+xml"\s*/?>',
                  f'<link rel="icon" href="{favicon}" type="image/svg+xml" />',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'href="\./css/style\.css(?:\?v=[^"]+)?"',
                  'href="./css/style.css?v=20260818-1"',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'src="\./js/main\.js(?:\?v=[^"]+)?"',
                  'src="./js/main.js?v=20260818-1"',
                  text,
                  count=1,
              )
              path.write_text(text, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')

          index = re.sub(
              r'<meta property="og:image" content="[^"]+"\s*/?>',
              f'<meta property="og:image" content="{preview}" />',
              index,
              count=1,
          )
          index = re.sub(
              r'<meta property="og:image:secure_url" content="[^"]+"\s*/?>',
              f'<meta property="og:image:secure_url" content="{preview}" />',
              index,
              count=1,
          )
          index = re.sub(
              r'<meta property="og:image:type" content="[^"]+"\s*/?>',
              '<meta property="og:image:type" content="image/png" />',
              index,
              count=1,
          )
          index = re.sub(
              r'<meta name="twitter:image" content="[^"]+"\s*/?>',
              f'<meta name="twitter:image" content="{preview}" />',
              index,
              count=1,
          )

          if 'property="og:image:width"' not in index:
              index = index.replace(
                  '  <meta property="og:image:type" content="image/png" />',
                  '  <meta property="og:image:type" content="image/png" />\n  <meta property="og:image:width" content="1200" />\n  <meta property="og:image:height" content="630" />',
                  1,
              )

          index = re.sub(
              r'("image"\s*:\s*")[^"]+("\s*,)',
              rf'\1{preview}\2',
              index,
              count=1,
          )

          if 'css/global-cta.css' not in index:
              index = index.replace(
                  '  <link rel="stylesheet" href="./css/style.css?v=20260818-1" />',
                  '  <link rel="stylesheet" href="./css/style.css?v=20260818-1" />\n  <link rel="stylesheet" href="./css/global-cta.css?v=20260805-1" />',
                  1,
              )

          if 'js/home-cta-enhance.js' not in index:
              index = index.replace(
                  '  <script src="./js/main.js?v=20260818-1" defer></script>',
                  '  <script src="./js/main.js?v=20260818-1" defer></script>\n  <script src="./js/home-cta-enhance.js?v=20260817-2" defer></script>',
                  1,
              )

          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '*.html'
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refresh SOST branding metadata"
            git push
          fi
