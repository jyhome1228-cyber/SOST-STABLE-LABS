name: Capture Project Websites

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/capture-projects.mjs"
      - ".github/workflows/capture-projects.yml"

permissions:
  contents: write

concurrency:
  group: capture-project-websites
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture project websites
        run: node scripts/capture-projects.mjs

      - name: Commit generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/projects data/project-captures.js

          if git diff --cached --quiet; then
            echo "No screenshot changes detected."
            exit 0
          fi

          git commit -m "Update automated project screenshots [skip ci]"
          git pull --rebase origin main
          git push origin main
