name: Capture RE:LIM

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/capture-relim.mjs"
      - ".github/workflows/capture-relim.yml"

permissions:
  contents: write

concurrency:
  group: capture-relim
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture RE:LIM
        run: node scripts/capture-relim.mjs

      - name: Commit generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/projects/relim data/project-relim-captures.js

          if git diff --cached --quiet; then
            echo "No RE:LIM screenshot changes detected."
            exit 0
          fi

          git commit -m "Update RE:LIM project screenshots [skip ci]"
          git pull --rebase origin main
          git push origin main
