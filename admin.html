<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#08090b" />
  <title>Inquiry Admin — SOST STABLE LABS</title>
  <link rel="icon" href="./assets/sost-symbol.svg?v=20260805-4" type="image/svg+xml" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/admin.css?v=20260805-3" />
  <link rel="stylesheet" href="./css/admin-view-fix.css?v=20260805-1" />
  <script type="module" src="./js/admin-inquiries.js?v=20260805-3"></script>
  <script type="module" src="./js/admin-view-fix.js?v=20260805-1"></script>
</head>
<body class="admin-body">
  <main class="admin-app">
    <section class="admin-login" data-admin-login>
      <div class="admin-login-card">
        <a class="admin-logo" href="./index.html"><img src="./assets/logo-sost-stable-labs.svg" alt="SOST STABLE LABS" /></a>
        <p class="admin-eyebrow">PRIVATE ADMIN</p>
        <h1>프로젝트 문의 관리</h1>
        <p>등록된 관리자 계정으로 로그인하면 문의 내용과 처리 상태를 확인할 수 있습니다.</p>
        <form data-admin-login-form>
          <label><span>관리자 이메일</span><input type="email" name="email" value="planus253@naver.com" readonly /></label>
          <label><span>비밀번호</span><input type="password" name="password" required autocomplete="current-password" placeholder="Firebase 관리자 비밀번호" /></label>
          <button type="submit">관리자 로그인</button>
        </form>
        <p class="admin-message" data-admin-login-message role="status"></p>
      </div>
    </section>

    <section class="admin-dashboard" data-admin-dashboard hidden>
      <header class="admin-header">
        <div>
          <a class="admin-logo" href="./index.html"><img src="./assets/logo-sost-stable-labs.svg" alt="SOST STABLE LABS" /></a>
          <p>PROJECT INQUIRY SYSTEM</p>
        </div>
        <div class="admin-header-actions">
          <span data-admin-account></span>
          <button type="button" data-admin-logout>로그아웃</button>
        </div>
      </header>

      <div class="admin-shell">
        <section class="admin-heading">
          <div><p class="admin-eyebrow">INQUIRY MANAGEMENT</p><h1>프로젝트 문의</h1></div>
          <p>새 문의는 실시간으로 들어오며, 검토·회신·종료 상태와 관리자 메모를 함께 관리할 수 있습니다.</p>
        </section>

        <section class="admin-stats" aria-label="문의 통계">
          <article><span>전체</span><strong data-stat-total>0</strong></article>
          <article><span>신규</span><strong data-stat-new>0</strong></article>
          <article><span>검토 중</span><strong data-stat-reviewing>0</strong></article>
          <article><span>회신 완료</span><strong data-stat-replied>0</strong></article>
        </section>

        <section class="admin-tools">
          <div class="admin-search"><input type="search" data-inquiry-search placeholder="회사명, 담당자, 이메일, 문의 내용 검색" /></div>
          <div class="admin-filters" data-inquiry-filters>
            <button type="button" class="is-active" data-status-filter="all">전체</button>
            <button type="button" data-status-filter="new">신규</button>
            <button type="button" data-status-filter="reviewing">검토 중</button>
            <button type="button" data-status-filter="replied">회신 완료</button>
            <button type="button" data-status-filter="closed">종료</button>
          </div>
        </section>

        <section class="admin-content">
          <div class="admin-list" data-inquiry-list><p class="admin-empty">문의 데이터를 불러오고 있습니다.</p></div>
          <aside class="admin-detail" data-inquiry-detail>
            <div class="admin-detail-empty"><span>INQUIRY DETAIL</span><p>왼쪽 목록에서 문의를 선택해주세요.</p></div>
          </aside>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
